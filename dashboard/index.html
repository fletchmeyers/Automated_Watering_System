<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Sensor Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"><div class="logo-leaf"></div></div>
    <h1>garden<span>/</span>dashboard</h1>
  </div>
  <div class="header-right">
    <!-- One chip per node: status dot + time since its last packet; click one
         to open that node's details below the header (dashboard.js) -->
    <div id="node-status" class="node-status"><span class="node-status-loading">loading...</span></div>
    <div class="unit-toggle" id="unit-toggle">
      <button id="unit-c-btn" class="unit-btn active" onclick="setUnitPref('C')" type="button">°C</button>
      <button id="unit-f-btn" class="unit-btn" onclick="setUnitPref('F')" type="button">°F</button>
    </div>
    <!-- The node Refresh polls and the ping test tests; filled from NODES in dashboard.js -->
    <select id="ping-node-select" title="Node to refresh or ping"></select>
    <button id="refresh-btn" onclick="triggerRefresh()">↺ refresh</button>
    <button id="ping-btn" onclick="runPingTest()">⇄ ping test</button>
    <span id="ping-result"></span>
  </div>
</header>

<!-- Refresh's progress, one step at a time, while it runs (dashboard.js) -->
<div id="poll-progress" class="poll-progress" hidden aria-live="polite"></div>

<!-- A full-width row per node opened from its chip in the header: its
     battery and storage, radio/system and sensor health (dashboard.js) -->
<div id="node-panels"></div>

<!-- Weather Forecast: a full-width row above the sensor cards, the forecast
     on the same line as its title (and the source picker under the title);
     the title folds it away -->
<section class="panel" id="weather-panel">
  <div class="weather-row">
    <div class="weather-title">
      <button type="button" class="panel-toggle" id="weather-toggle" onclick="toggleWeatherPanel()" aria-expanded="true">
        <span class="panel-caret">▾</span><span class="card-title">Weather Forecast</span>
      </button>
      <select id="weather-source-select" onchange="onWeatherSourceChange(this.value)"></select>
    </div>
    <div id="weather-body"><div class="no-data">Loading...</div></div>
  </div>
</section>

<!-- The sensor cards (one per sensor per node), created by dashboard.js as
     each node's data arrives -->
<div class="grid" id="grid"></div>

<!-- Populated when one or more cards above are hidden; click "show" to restore -->
<div id="hidden-cards-bar"></div>

<!-- Analysis panel — separate section, its own refresh cadence (none, plot-on-demand) -->
<div class="card card-wide" id="card-analysis" style="margin-top:16px;">
  <div class="card-header">
    <span class="card-title">Analysis</span>
    <div class="analysis-mode-toggle">
      <button id="mode-timeseries-btn" class="mode-btn active" onclick="setAnalysisMode('timeseries')" type="button">Time-series</button>
      <button id="mode-scatter-btn" class="mode-btn" onclick="setAnalysisMode('scatter')" type="button">Scatter</button>
      <button id="mode-dayover-btn" class="mode-btn" onclick="setAnalysisMode('dayover')" type="button">Day/day</button>
      <button id="mode-trend-btn" class="mode-btn" onclick="setAnalysisMode('trend')" type="button">Trend</button>
      <button id="mode-rate-btn" class="mode-btn" onclick="setAnalysisMode('rate')" type="button">Rate of change</button>
      <button id="mode-correlation-btn" class="mode-btn" onclick="setAnalysisMode('correlation')" type="button">Correlation</button>
      <button id="mode-gaps-btn" class="mode-btn" onclick="setAnalysisMode('gaps')" type="button">Data gaps</button>
    </div>
  </div>

  <div id="mode-info" class="mode-info"></div>

  <div id="ts-field-picker" class="field-picker"></div>
  <div class="overlay-toggle" id="ts-overlay-toggle">
    <button id="raw-toggle-btn" class="overlay-btn" onclick="toggleOverlay('raw')" type="button">Raw</button>
    <button id="smoothed-toggle-btn" class="overlay-btn active" onclick="toggleOverlay('smoothed')" type="button">Smoothed</button>
    <button id="zoom-btn" class="overlay-btn" onclick="toggleZoom()" type="button" style="display:none" title="Let dragging on the plot zoom (otherwise it scrolls the page)">Zoom</button>
  </div>
  <div id="scatter-field-picker" class="scatter-field-row" style="display:none;">
    <div class="scatter-axis-row">
      <label>X axis</label>
      <select id="scatter-x-select"></select>
    </div>
    <button id="scatter-swap-btn" class="scatter-swap-btn" onclick="swapScatterFields()" type="button" title="Swap X and Y">⇄</button>
    <div class="scatter-axis-row">
      <label>Y axis</label>
      <select id="scatter-y-select"></select>
    </div>
  </div>

  <div id="dayover-field-picker" class="scatter-field-row" style="display:none;">
    <div class="scatter-axis-row">
      <label>Field</label>
      <select id="dayover-field-select"></select>
    </div>
  </div>

  <div class="time-range-row">
    <!-- Time window: plotted once (Refresh window moves it up to now).
         Live data: the window keeps ending now, and the plot updates
         whenever a plotted field gets a new reading from the Pi. -->
    <div class="range-mode" role="radiogroup" aria-label="What to plot">
      <label><input type="radio" name="range-mode" value="window" checked onchange="setLiveData(false)"> Time window</label>
      <label><input type="radio" name="range-mode" value="live" onchange="setLiveData(true)"> Live data</label>
    </div>
    <div class="preset-btns" id="preset-btns"></div>
    <div class="custom-range">
      <input type="datetime-local" id="range-start">
      <span>to</span>
      <input type="datetime-local" id="range-end">
    </div>
    <div class="plot-actions">
      <button id="share-axes-btn" class="action-btn" onclick="toggleShareAxes()" type="button" disabled>Shared axes</button>
      <button id="clear-fields-btn" class="action-btn action-red" onclick="clearFields()" type="button" title="Untick every field">Clear</button>
      <button id="refresh-window-btn" class="action-btn action-teal action-icon" onclick="refreshWindow()" type="button" title="Refresh the window: move it up to now and plot it again" aria-label="Refresh the time window">↻</button>
      <button id="plot-btn" onclick="runAnalysisPlot()" type="button">Plot</button>
    </div>
  </div>

  <div id="analysis-status" class="no-data" style="display:none;"></div>
  <div id="analysis-plot"></div>
</div>

<footer>
  <span>live from sensors.db · new readings every 10s</span>
  <span>packets in window: <span id="packets-count">–</span></span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="dashboard.js"></script>
<script src="weather.js"></script>
<script src="analysis.js"></script>
<script>
// ── Boot ─────────────────────────────────────────────────────────────────────

// Node names and colors come from the Pi (/api/nodes); everything else waits for them
// (a few seconds at most — loadNodes() falls back to its built-in list).
loadNodes().then(() => {
  initUnitToggle();
  initWeatherToggle();
  buildPingNodeSelect();
  refresh();
  setInterval(refresh, REFRESH_MS);
  // The node list again every minute, so a sensor that finishes calibrating
  // (or a node just added) shows without reloading the page.
  setInterval(() => loadNodes().then(() => { if (currentPackets.length) renderAll(currentPackets); }), NODES_REFRESH_MS);
  initCardCustomization();
  initAnalysisPanel();
  initWeatherPanel();
});
</script>
</body>
</html>
