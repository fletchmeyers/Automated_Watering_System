; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
; Readings as 32-bit floats: 5 bytes each in MessagePack (radio_format), not 9
build_flags = -D ARDUINOJSON_USE_DOUBLE=0
lib_deps = 
	bblanchon/ArduinoJson
	adafruit/Adafruit seesaw Library
	adafruit/Adafruit MAX1704X
	adafruit/Adafruit LTR390 Library
	adafruit/Adafruit SHT4x Library
	adafruit/Adafruit SGP40 Sensor
	adafruit/Adafruit INA237 and INA238 Library
	adafruit/Adafruit SleepyDog Library

[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
build_flags = ${env.build_flags} -D BOARD_FEATHER_M0
build_src_filter = +<*> -<wifi_link.cpp>
lib_deps = 
	${env.lib_deps}
	mikem/RadioHead@1.120
	arduino-libraries/RTCZero
	adafruit/RTClib
	adafruit/SdFat - Adafruit Fork
	adafruit/Adafruit SleepyDog Library@^1.8.4

[env:feather_m0_wifi]
extends = env:feather_m0
build_flags = ${env.build_flags} -D BOARD_FEATHER_M0 -D BOARD_HAS_WINC1500
build_src_filter = +<*>
lib_deps = 
	${env:feather_m0.lib_deps}
	arduino-libraries/WiFi101
	cmaglie/FlashStorage

[rp2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
build_flags = ${env.build_flags} -D BOARD_RP2
build_src_filter = +<*> -<wifi_link.cpp>
lib_deps = 
	${env.lib_deps}
	https://www.airspayce.com/mikem/arduino/RadioHead/RadioHead-1.146.zip
	adafruit/RTClib
lib_ignore = iLabs Hearth

[env:pico]
extends = rp2
board = rpipico

[env:picow]
extends = rp2
board = rpipicow
build_src_filter = +<*>

[env:pico2]
extends = rp2
board = rpipico2

[env:pico2w]
extends = rp2
board = rpipico2w
build_src_filter = +<*>

[env:feather_rp2040_adalogger]
extends = rp2
board = adafruit_feather_adalogger

[esp32]
platform = espressif32
build_flags = ${env.build_flags} -D BOARD_ESP32
lib_deps = 
	${env.lib_deps}
	mikem/RadioHead@1.120
	adafruit/SdFat - Adafruit Fork
	adafruit/RTClib

[env:feather_esp32s2]
extends = esp32
board = adafruit_feather_esp32s2

[env:feather_esp32_v2]
extends = esp32
board = adafruit_feather_esp32_v2
