[env]
framework = arduino
monitor_speed = 115200
; RadioHead is pinned per board below: the M0 keeps the version its radio link
; was proven with; the RP2 boards need a newer one (1.120 doesn't build for
; the RP2350).
lib_deps =
    bblanchon/ArduinoJson
    adafruit/Adafruit seesaw Library
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit LTR390 Library
    adafruit/Adafruit SHT4x Library
    adafruit/Adafruit SGP40 Sensor
    adafruit/Adafruit INA237 and INA238 Library

[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
build_flags = -D BOARD_FEATHER_M0
lib_deps =
    ${env.lib_deps}
    mikem/RadioHead@1.120
    arduino-libraries/RTCZero
    adafruit/RTClib
    adafruit/SdFat - Adafruit Fork

; ── RP2040 / RP2350 boards (Arduino-Pico core) ────────────────────────────
; Earle Philhower's Arduino-Pico core, through Max Gerhardt's PlatformIO
; platform (the official "raspberrypi" platform doesn't include it). Board
; names match "board" in nodes.json; see board_config_rp2.h.
[rp2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
build_flags = -D BOARD_RP2
lib_deps =
    ${env.lib_deps}
    https://www.airspayce.com/mikem/arduino/RadioHead/RadioHead-1.146.zip
    adafruit/RTClib

[env:pico]
extends = rp2
board = rpipico

[env:picow]
extends = rp2
board = rpipicow

[env:pico2]
extends = rp2
board = rpipico2

[env:pico2w]
extends = rp2
board = rpipico2w

[env:feather_rp2040_adalogger]
extends = rp2
board = adafruit_feather_adalogger
