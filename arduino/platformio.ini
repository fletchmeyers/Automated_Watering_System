[env]
framework = arduino
monitor_speed = 115200
; RadioHead is pinned per board below: the M0 keeps the version its radio link
; was proven with; the RP2 boards need a newer one (1.120 doesn't build for
; the RP2350).
lib_deps =
    bblanchon/ArduinoJson
    adafruit/Adafruit seesaw Library
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit LTR390 Library
    adafruit/Adafruit SHT4x Library
    adafruit/Adafruit SGP40 Sensor
    adafruit/Adafruit INA237 and INA238 Library

[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
build_flags = -D BOARD_FEATHER_M0
build_src_filter = +<*> -<wifi_link.cpp>   ; no Wi-Fi chip on this board
lib_deps =
    ${env.lib_deps}
    mikem/RadioHead@1.120
    arduino-libraries/RTCZero
    adafruit/RTClib
    adafruit/SdFat - Adafruit Fork

; The Feather M0 WiFi (Adafruit 3044): the same board plus an ATWINC1500
; Wi-Fi module on CS 8, IRQ 7, RST 4, EN 2. Wi-Fi nodes need its WiFi101
; library (a big share of the M0's 256 KB, which is why node_setup.py asks
; first) and FlashStorage to keep the Wi-Fi settings in flash.
[env:feather_m0_wifi]
extends = env:feather_m0
build_flags = -D BOARD_FEATHER_M0 -D BOARD_HAS_WINC1500
build_src_filter = +<*>
lib_deps =
    ${env:feather_m0.lib_deps}
    arduino-libraries/WiFi101
    cmaglie/FlashStorage

; ── RP2040 / RP2350 boards (Arduino-Pico core) ────────────────────────────
; Earle Philhower's Arduino-Pico core, through Max Gerhardt's PlatformIO
; platform (the official "raspberrypi" platform doesn't include it). Board
; names match "board" in nodes.json; see board_config_rp2.h.
[rp2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
build_flags = -D BOARD_RP2
; wifi_link.cpp is only for boards with a Wi-Fi chip (picow, pico2w below);
; left out here, or its <WiFi.h> would pull this core's Wi-Fi libraries into
; every Pico build.
build_src_filter = +<*> -<wifi_link.cpp>
lib_deps =
    ${env.lib_deps}
    https://www.airspayce.com/mikem/arduino/RadioHead/RadioHead-1.146.zip
    adafruit/RTClib
; This core's iLabs Hearth library also supplies a Preferences.h, so the
; library finder (which doesn't read #if) would pull it in for wifi_link.cpp's
; ESP32-only include, and it doesn't build on these boards.
lib_ignore = iLabs Hearth

[env:pico]
extends = rp2
board = rpipico

[env:picow]
extends = rp2
board = rpipicow
build_src_filter = +<*>   ; Wi-Fi nodes (wifi_link.cpp)

[env:pico2]
extends = rp2
board = rpipico2

[env:pico2w]
extends = rp2
board = rpipico2w
build_src_filter = +<*>   ; Wi-Fi nodes (wifi_link.cpp)

[env:feather_rp2040_adalogger]
extends = rp2
board = adafruit_feather_adalogger

; ── ESP32 boards (Espressif Arduino core) ──────────────────────────────────
; Flashed over USB serial like the M0 (esptool); see board_config_esp32.h.
[esp32]
platform = espressif32
build_flags = -D BOARD_ESP32
lib_deps =
    ${env.lib_deps}
    mikem/RadioHead@1.120
    adafruit/SdFat - Adafruit Fork
    adafruit/RTClib

[env:feather_esp32s2]
extends = esp32
board = adafruit_feather_esp32s2

[env:feather_esp32_v2]
extends = esp32
board = adafruit_feather_esp32_v2
